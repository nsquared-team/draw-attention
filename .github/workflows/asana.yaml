name: Sync with Asana

# This workflow fires on comment and review events from any account that can reach
# the repo, and neither action below uses the ambient GITHUB_TOKEN: the comment
# action authenticates with its own PAT input, and the attachment action makes no
# GitHub API calls. An empty block drops the token's default write scopes so the
# job cannot act on the repo if a step is ever re-shaped.
permissions: {}

on:
  issue_comment:
    types: [created, edited, deleted]

  pull_request_review_comment:
    types: [created, edited, deleted]
    
  pull_request_review:
    types: [submitted]

  pull_request:
    types: [opened, closed, reopened, ready_for_review, review_requested, edited]

jobs:
  # Create Attachment on PR opened, reopened, and edited 
  create-asana-attachment-job:
    name: Create pull request attachments on Asana tasks
    if: github.event_name == 'pull_request' && ( github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'edited' )
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request attachments
        uses: Asana/create-app-attachment-github-action@main
        id: postAttachment
        with:
          asana-secret: ${{ secrets.OTTO_ASANA_SECRET_TOKEN }}
      - name: Log output status
        # Same rule as the Get Output step below: nothing reaches the script through a
        # `${{ }}` expansion, so the file holds no template expansion inside any `run:`.
        env:
          OUT_STATUS: ${{ steps.postAttachment.outputs.status }}
        run: echo "Status is $OUT_STATUS"
  
  # Create Comment Always Except On PR edited 
  create-comment-in-asana-task-job:
    name: Create a comment in Asana Task
    runs-on: ubuntu-latest
    steps:
      - name: Create a comment
        uses: nsquared-team/asana-comment-on-task-github-action@main
        id: createComment
        with:
          github-pat: ${{ secrets.OTTO_GITHUB_PAT }}
          asana-pat: ${{ secrets.OTTO_ASANA_PAT}}
          asana-secret: ${{ secrets.OTTO_ASANA_SECRET_TOKEN }}
          comment-text: "PR #{{PR_ID}} {{PR_NAME}} is {{PR_STATE}} -> {{PR_URL}}"
      - name: Get Output
        # These outputs are built from the PR comment and review bodies, which anyone
        # able to comment controls. A `${{ }}` expansion is pasted into the script
        # before bash parses it, so the text becomes code: a review containing
        # backticks failed this step outright, and one containing `$(...)` would have
        # run on the runner with the three tokens above in scope. Passing them through
        # `env:` and quoting keeps them data.
        env:
          OUT_EVENT: ${{ steps.createComment.outputs.event }}
          OUT_ACTION: ${{ steps.createComment.outputs.action }}
          OUT_FOLLOWERS_STATUS: ${{ steps.createComment.outputs.followersStatus }}
          OUT_COMMENT_STATUS: ${{ steps.createComment.outputs.commentStatus }}
          OUT_COMMENT: ${{ steps.createComment.outputs.comment }}
        run: |
          echo "Event:"
          echo "$OUT_EVENT"
          echo "Action:"
          echo "$OUT_ACTION"
          echo "Followers Status:"
          echo "$OUT_FOLLOWERS_STATUS"
          echo "Comment Status:"
          echo "$OUT_COMMENT_STATUS"
          echo "Comment:"
          echo "$OUT_COMMENT"